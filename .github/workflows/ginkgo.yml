name: Build ginkgo UEFI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup
        run: bash ./setup_env.sh -p apt

      - name: Build ginkgo
        run: ./build_uefi.py -d ginkgo -r DEBUG -c

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: uefi-ginkgo
          path: ./Mu-*
